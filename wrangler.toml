#:schema node
name = "hearsay"
main = "worker.js"
compatibility_date = "2026-05-26"

# D1 database for coordination state (claims, mailbox, A2A tasks, audit log)
[[d1_databases]]
binding = "HEARSAY_D1"
database_name = "hearsay-db"
database_id = "hearsay-db-id"

# Durable Object for the CoordinatorDO class (namespace-scoped sweeper, future request routing)
[[durable_objects]]
class_name = "CoordinatorDO"

[[durable_objects.bindings]]
name = "COORDINATOR_DO"
class_name = "CoordinatorDO"

# Build: compile Go to WASM, copy wasm_exec.js, run D1 migrations
[build]
command = '''
npx wrangler d1 migrations apply HEARSAY_D1 --remote &&
GOOS=js GOARCH=wasm go build -o hearsay.wasm ./cmd/hearsay &&
cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" .
'''

[build.upload]
main = "worker.js"

[env.production]
compatibility_date = "2026-05-26"