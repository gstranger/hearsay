name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      - name: Build (native)
        run: go build ./cmd/hearsay

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build (WASM)
        run: GOOS=js GOARCH=wasm go build ./cmd/hearsay

      - name: Build tag audit
        run: |
          echo "=== WASM-only files (must have //go:build wasm) ==="
          for f in cmd/hearsay/main_wasm.go internal/d1/d1.go internal/do/do.go internal/server/sweeper_wasm.go; do
            if head -1 "$f" | grep -q 'wasm'; then
              echo "  ✅ $f"
            else
              echo "  ❌ $f missing build tag"
              exit 1
            fi
          done

          echo "=== Native-only files (must have //go:build !wasm) ==="
          for f in cmd/hearsay/main_native.go cmd/hearsay/cmd_claims.go cmd/hearsay/cmd_config.go cmd/hearsay/cmd_other.go cmd/hearsay/cmd_serve.go internal/sqlite/sqlite.go internal/postgres/postgres.go internal/managed/managed.go internal/server/sweeper_native.go; do
            if head -1 "$f" | grep -q '!wasm'; then
              echo "  ✅ $f"
            else
              echo "  ❌ $f missing build tag"
              exit 1
            fi
          done

          echo "=== Shared files (must NOT have build tag) ==="
          for f in internal/server/sse.go pkg/hearsay/provider.go; do
            first=$(head -1 "$f")
            if echo "$first" | grep -q 'build'; then
              echo "  ❌ $f has unexpected build tag: $first"
              exit 1
            else
              echo "  ✅ $f"
            fi
          done

          echo "=== All build tags correct ==="

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: TypeScript SDK tests
        run: npm test